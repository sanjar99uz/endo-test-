<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Endodontiya — 5-semestr testi</title>
<style>
:root{--bg:#eef8f8;--card:#fff;--ink:#12353b;--mut:#5c7c82;--pri:#0e9aa7;--pri2:#0a6f7a;--line:#d3e8ea;--ok:#1a9a5b;--okbg:#e4f6ec;--bad:#d6455d;--badbg:#fdeaee;--sel:#e0f4f6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1b1e;--card:#12282c;--ink:#e3f2f3;--mut:#8fb0b5;--pri:#35c4d1;--pri2:#7fdbe4;--line:#24434a;--ok:#4cd08a;--okbg:#10301f;--bad:#ff7a90;--badbg:#38161e;--sel:#173a40;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b1b1e;--card:#12282c;--ink:#e3f2f3;--mut:#8fb0b5;--pri:#35c4d1;--pri2:#7fdbe4;--line:#24434a;--ok:#4cd08a;--okbg:#10301f;--bad:#ff7a90;--badbg:#38161e;--sel:#173a40;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:90px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5}
header{background:linear-gradient(135deg,#0a6f7a,#13b5c2);color:#fff;padding:26px 16px 52px;text-align:center}
header svg{width:54px;height:54px;margin-bottom:6px}
header h1{margin:0;font-size:1.6rem}
header p{margin:6px auto 0;max-width:640px;opacity:.92;font-size:.95rem}
.wrap{max-width:780px;margin:-34px auto 40px;padding:0 14px}
.bar{position:sticky;top:0;z-index:5;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 14px;box-shadow:0 4px 14px rgba(0,0,0,.08);margin-bottom:16px}
.bar .row{display:flex;justify-content:space-between;font-size:.85rem;color:var(--mut);margin-bottom:6px}
.track{height:8px;background:var(--line);border-radius:8px;overflow:hidden}
.fill{height:100%;width:0;background:linear-gradient(90deg,#13b5c2,#4fd3a6);transition:width .25s}
h2.sec{margin:26px 4px 10px;font-size:1.05rem;color:var(--pri2);display:flex;align-items:center;gap:8px}
h2.sec:before{content:"";width:10px;height:10px;border-radius:50% 50% 50% 0;background:var(--pri);transform:rotate(-45deg)}
.q{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
.q .t{font-weight:600;margin-bottom:10px}
.q .t b{color:var(--pri);margin-right:4px}
.o{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:var(--card);color:var(--ink);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:8px;font:inherit;cursor:pointer;transition:.15s}
.o:hover{border-color:var(--pri)}
.o i{flex:none;width:26px;height:26px;border-radius:50%;background:var(--line);display:grid;place-items:center;font-style:normal;font-weight:700;font-size:.8rem}
.o.sel{background:var(--sel);border-color:var(--pri)}
.o.sel i{background:var(--pri);color:#fff}
.o.ok{background:var(--okbg);border-color:var(--ok)}
.o.ok i{background:var(--ok);color:#fff}
.o.bad{background:var(--badbg);border-color:var(--bad)}
.o.bad i{background:var(--bad);color:#fff}
.locked .o{cursor:default}
.exp{display:none;margin-top:12px;padding:10px 12px;border-radius:10px;background:var(--sel);border-left:4px solid var(--pri);font-size:.92rem}
.locked .exp{display:block}
.exp b{color:var(--pri2)}
.fin{display:block;margin:26px auto 0;padding:14px 34px;border:0;border-radius:30px;background:linear-gradient(135deg,#0a6f7a,#13b5c2);color:#fff;font:700 1.05rem inherit;font-family:inherit;cursor:pointer;box-shadow:0 6px 16px rgba(14,154,167,.35)}
.res{display:none;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;text-align:center;margin-bottom:18px}
.res .ring{width:130px;height:130px;margin:0 auto 10px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--pri) calc(var(--p)*1%),var(--line) 0)}
.res .ring span{width:100px;height:100px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-size:1.7rem;font-weight:800;color:var(--pri2)}
.res h3{margin:4px 0}
.stats{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:12px 0}
.stats div{padding:6px 14px;border-radius:20px;font-size:.9rem;font-weight:600}
.s1{background:var(--okbg);color:var(--ok)}.s2{background:var(--badbg);color:var(--bad)}.s3{background:var(--sel);color:var(--mut)}
.btn2{padding:10px 24px;border:1.5px solid var(--pri);background:transparent;color:var(--pri2);border-radius:24px;font:600 .95rem inherit;font-family:inherit;cursor:pointer}
dialog{border:1px solid var(--line);border-radius:16px;background:var(--card);color:var(--ink);padding:20px;max-width:360px}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog .acts{display:flex;gap:10px;justify-content:flex-end;margin-top:14px}
dialog .acts button{padding:8px 18px;border-radius:20px;border:1.5px solid var(--pri);background:var(--pri);color:#fff;font:600 .9rem inherit;font-family:inherit;cursor:pointer}
dialog .acts button.c{background:transparent;color:var(--pri2)}
</style>
</head>

<script>
var S=[
["I. Endodontik asboblar va ularning sterilizatsiyasi",1,7],
["II. Tish bo‘shlig‘ining topografik anatomiyasi va ochish texnikasi",8,15],
["III. Pulpani olib tashlash va ildiz kanalini kengaytiruvchi asboblar",16,23],
["IV. Qiyin o‘tuvchi va qiyshiq kanallarga ishlov berish",24,28],
["V. Ildiz kanaliga medikamentoz va kimyoviy ishlov berish",29,35],
["VI. Ishchi uzunlikni aniqlash usullari",36,40],
["VII. Kanalni kengaytirish va medikamentoz ishlov berish usullari",41,45],
["VIII. Plombalashga tayyorgarlik va qotmaydigan malhamlar",46,50]];
// [savol, TO‘G‘RI javob, [noto‘g‘ri 1,2,3], izoh]
var D=[
["Endodontik asboblarni ISO standartiga muvofiq rangli kodlashda qizil rang qaysi o‘lchamga mos keladi?","ISO 25",["ISO 15","ISO 20","ISO 30"],"ISO rang kodi: 15 – oq, 20 – sariq, 25 – qizil, 30 – ko‘k."],
["K-file va H-file (Hedström) asboblarining asosiy konstruktiv farqi nimada?","K-file burama metall simdan tayyorlanadi, H-file esa metall sterjenni frezalash orqali hosil qilinadi.",["K-file faqat aylanish harakati bilan, H-file faqat tebranish bilan ishlaydi.","H-file faqat zanglamaydigan po‘latdan, K-file esa faqat nikeltitan qotishmasidan tayyorlanadi.","Ularning konstruksiyasi va ishlash prinsipi bir xil."],"K-file simni burash, H-file sterjenni frezalash yo‘li bilan tayyorlanadi; shu sababli H-file kesuvchi qirralari o‘tkir bo‘ladi."],
["Hedström faylidan foydalanishda qaysi harakat eng samarali hisoblanadi?","Kanal devoriga bosim bermasdan, tortib chiqarish harakati.",["Kuchli soat mili yo‘nalishida aylantirish.","Kanal ichida uzluksiz rotatsion harakat qilish.","Asbobni kanal ichida kuch bilan apikal tomonga surish."],"H-file tortib chiqarish (egovlash) harakatida samarali kesadi; aylantirish va kuch bilan surish asbob sinishiga olib keladi."],
["Endodontik asboblarni sterilizatsiyadan oldingi tozalashning asosiy maqsadi nima?","Organik va noorganik qoldiqlarni yo‘qotib, sterilizatsiya samaradorligini oshirish.",["Asbobning rangini tiklash.","Asbobning kesuvchi qismini o‘tkirlash.","Asbobning elastikligini oshirish."],"Qoldiqlar mikroorganizmlarni himoya qiladi, shuning uchun avval tozalash, so‘ng sterilizatsiya qilinadi."],
["Nikeltitan (NiTi) asboblarining zanglamaydigan po‘lat asboblarga nisbatan asosiy afzalligi qaysi?","Yuqori elastiklik va egri kanallarda shaklni saqlash imkoniyati.",["Yuqori qattiqlik va mo‘rtlik.","Faqat bir martalik foydalanishga mo‘ljallanganligi.","Barcha kanallarni irrigatsiyasiz kengaytirishi."],"NiTi qotishmasi superelastik bo‘lib, kanal egriligiga moslashadi va transportatsiya xavfini kamaytiradi."],
["Endodontik asboblarni avtoklavda sterilizatsiya qilish qaysi omilga asoslanadi?","Bosim ostidagi to‘yingan suv bug‘ining ta’siriga.",["Quruq issiq havo ta’siriga.","Ultrabinafsha nurlanishga.","Kimyoviy bug‘lanishga."],"Avtoklavda yuqori bosim va to‘yingan suv bug‘i (odatda 121–134 °C) mikroorganizmlarni yo‘q qiladi."],
["Endodontik faylning siklik charchashi (cyclic fatigue) qachon yuzaga keladi?","Fayl egri kanal ichida takroriy cho‘zilish va siqilish ta’siriga uchraganda.",["Fayl faqat to‘g‘ri kanalda ishlatilganda.","Fayl faqat sterilizatsiya vaqtida.","Fayl irrigatsion eritmaga tekkanda."],"Egrilik nuqtasida metall navbatma-navbat cho‘ziladi va siqiladi, natijada kutilmaganda sinish mumkin."],
["Yuqori birinchi molyar tishda odatda nechta ildiz kanali mavjud bo‘ladi?","4 ta",["2 ta","3 ta","5 ta"],"Ikki ildizli mezial (MB1, MB2), distobukkal va palatinal – jami 4 ta kanal."],
["Yuqori birinchi molyar tishda ko‘pincha aniqlanishi qiyin bo‘lgan qo‘shimcha kanal qaysi?","MB2",["DB2","Palatinal qo‘shimcha kanal","Distal apikal kanal"],"MB2 (ikkinchi mezio-bukkal kanal) bu tishda eng ko‘p uchraydi va topish qiyin; ko‘pincha mikroskop/lupa talab qilinadi."],
["Pastki birinchi molyar tishda pulpa kamerasini ochish uchun odatda qaysi shakldagi trepanatsion kirish qo‘llaniladi?","To‘rtburchak yoki trapetsiyasimon",["Uchburchak","Doirasimon","Oval, faqat distal tomonda"],"Pastki molyarda mezial 2 va distal 1–2 kanal og‘zi borligi uchun kirish to‘rtburchak/trapetsiya shaklida bo‘ladi."],
["Endodontik kirish bo‘shlig‘ini tayyorlashda asosiy maqsad nima?","Pulpa kamerasini to‘liq ochish va kanal og‘izlariga to‘g‘ri kirishni ta’minlash.",["Tish tojining barcha qismini olib tashlash.","Faqat pulpa shoxlarini olib tashlash.","Ildiz kanalini darhol apikal teshikkacha kengaytirish."],"To‘g‘ri chiziqli kirish asboblarni kanalga to‘siqsiz kiritishga imkon beradi."],
["Yuqori kesuvchi tishlarda endodontik kirish bo‘shlig‘i qaysi yuzadan ochiladi?","Tanglay yuzasidan",["Vestibulyar yuzadan","Mezial yuzadan","Distal yuzadan"],"Tanglay (palatinal) yuzadan ochilganda estetik vestibulyar yuza saqlanadi va kanalga to‘g‘ri kirish ta’minlanadi."],
["Tish bo‘shlig‘ining tomi to‘liq olib tashlanmasa, qanday asorat yuzaga kelishi mumkin?","Pulpa to‘qimasi qoldiqlari va kanal og‘izlarining aniqlanmasligi.",["Kanalning tabiiy kengayishi.","Ildiz uzunligining ortishi.","Apikal teshikning yopilishi."],"Tomning qoldig‘i kanal og‘izlarini yopib qo‘yadi, pulpa qoldig‘i qoladi va tish rangi o‘zgarishi mumkin."],
["Endodontik kirish bo‘shlig‘ini tayyorlashda endodontik zondning asosiy vazifasi nima?","Kanal og‘izlarini aniqlash va tekshirish.",["Kanalni kengaytirish.","Guttaperchani kondensatsiyalash.","Irrigatsion eritmani faollashtirish."],"Endodontik zond (DG-16) kamera tubini paypaslab, kanal og‘izlarini topish uchun ishlatiladi."],
["Ildiz kanalining tabiiy anatomik egriligini saqlash nima uchun muhim?","Kanal transportatsiyasi, pog‘ona hosil bo‘lishi va perforatsiya xavfini kamaytirish uchun.",["Kanalni tezroq plombalash uchun.","Pulpa kamerasini kengaytirish uchun.","Sealer sarfini oshirish uchun."],"Egrilik saqlansa, kanalning asl o‘qi buzilmaydi va ishlov berish xavfsiz bo‘ladi."],
["Pulpektomiya jarayonida pulpa to‘qimasini olib tashlash uchun qaysi asbob ishlatiladi?","Pulpa ekstraktori (barbed broach)",["Lentulo spirali","Spreader","Plugger"],"Barbed broach tikanaksimon tishchalari bilan pulpani o‘rab, bir butun holda chiqaradi."],
["Pulpa ekstraktoridan foydalanishda asosiy xavf nimadan iborat?","Asbobning kanal ichida sinishi yoki pulpaning apikal tomonga surilishi.",["Kanal devorining remineralizatsiyasi.","Guttaperchaning qotishi.","Kanalning kimyoviy kengayishi."],"Asbob nozik va mo‘rt: kanalga siqilib qolsa yoki kuch ishlatilsa sinadi, noto‘g‘ri ishlatilsa pulpani apikal tomonga suradi."],
["Ildiz kanalini mexanik kengaytirishda K-reamerning asosiy vazifasi nima?","Kanalni mexanik kengaytirish va shakllantirish.",["Kanalga sealer kiritish.","Pulpa kamerasini ochish.","Kanalni quritish."],"K-reamer aylantirish harakati bilan kanalni kengaytiradi va shakllantiradi."],
["Reamer va K-file asboblarining asosiy farqi qaysi javobda to‘g‘ri ko‘rsatilgan?","Reamer asosan aylantirish, K-file esa egovlash harakatlari bilan ishlatiladi.",["Reamer faqat tortish, K-file faqat itarish harakati bilan ishlaydi.","Reamer faqat irrigatsiya uchun ishlatiladi.","Ular faqat materiali bilan farqlanadi."],"Reamer burama (aylanma) harakat bilan, K-file esa egovlash (tortish) harakati bilan ishlaydi."],
["Egri ildiz kanalida qattiq po‘latdan tayyorlangan katta o‘lchamli faylni kuch bilan apikal tomonga kiritish qanday oqibatga olib kelishi mumkin?","Kanal transportatsiyasi yoki pog‘ona hosil bo‘lishi.",["Kanal egriligining tiklanishi.","Dentin qalinligining ortishi.","Kanalning tabiiy ravishda yopilishi."],"Qattiq fayl to‘g‘rilanishga intiladi va kanalning tashqi devorini kesadi – pog‘ona, transportatsiya, perforatsiya."],
["Glide path (sirpanish yo‘li) tayyorlashdan asosiy maqsad nima?","Keyingi mexanik asboblarning xavfsiz va erkin harakatlanishi uchun silliq yo‘l yaratish.",["Kanalni to‘liq plombalash.","Pulpa kamerasini sterilizatsiya qilish.","Apikal teshikni yopish."],"Kichik fayllar (masalan, #10–15) bilan silliq yo‘l ochilsa, NiTi asboblar sinish xavfi kamayadi."],
["Crown-down usulida kanalga mexanik ishlov berish qaysi yo‘nalishda amalga oshiriladi?","Koronal qismdan apikal qismga.",["Apikal qismdan koronalki qismga.","Kanal o‘rtasidan ikki tomonga.","Faqat kanal og‘zida."],"Crown-down: avval koronal va o‘rta qism, so‘ng apikal qism kengaytiriladi."],
["Egri kanallarda NiTi asboblarining ustunligi qaysi xususiyat bilan bog‘liq?","Superelastikligi va egiluvchanligi bilan.",["Yuqori qattiqligi bilan.","Dentin bilan kimyoviy birikishi bilan.","Yuqori issiqlik o‘tkazuvchanligi bilan."],"Superelastiklik NiTi asbobga kanalning egrilik shaklini saqlash imkonini beradi."],
["Obliteratsiyaga uchragan ildiz kanalini aniqlashda qaysi usul diagnostik jihatdan eng foydali?","Rentgenologik tekshiruv va zarur hollarda CBCT.",["Faqat vizual ko‘rik.","Faqat perkussiya.","Faqat palpatsiya."],"Rentgen va CBCT kanalning joylashuvi, yo‘nalishi va chuqurligini ko‘rsatadi."],
["Egri kanalga ishlov berishda asbobning kanalning tashqi devoriga siljishi qanday hodisa deyiladi?","Kanal transportatsiyasi.",["Kanal obturatsiyasi.","Pulpa nekrozi.","Apikal kondensatsiya."],"Transportatsiya – kanalning asl o‘qidan chetga og‘ish, kanalning tashqi egrilik tomoniga siljishi."],
["Step-back texnikasining asosiy mohiyati nimada?","Ishchi uzunlikda apikal qismni tayyorlab, keyinchalik kattaroq o‘lchamdagi asboblar bilan bosqichma-bosqich qisqaroq uzunlikda ishlash.",["Katta o‘lchamli asboblar bilan koronal qismdan boshlash.","Kanalni faqat kimyoviy kengaytirish.","Kanalni faqat rotatsion asboblar bilan plombalash."],"Avval apikal qism ishchi uzunlikda tayyorlanadi, so‘ng har bir keyingi katta fayl ~1 mm qisqaroq ishlatiladi (konussimon shakl)."],
["Faylning ildiz kanalida sinib qolishiga sabab bo‘luvchi asosiy omillardan biri qaysi?","Faylni ortiqcha zo‘riqtirish va takroriy mexanik charchash.",["Kanalni doimiy irrigatsiya qilish.","Ishchi uzunlikni aniqlash.","Kanalni quritish."],"Ortiqcha bosim, torsion yuklama va takroriy ishlatishdan metall charchaydi."],
["Qiyshiq kanallarda asbob sinishining oldini olish uchun qaysi yondashuv to‘g‘ri?","Glide path yaratish, irrigatsiya qilish va ishlab chiqaruvchi ko‘rsatmalariga rioya etish.",["Faylni kuch bilan kiritish.","Faqat katta diametrli fayllardan foydalanish.","Asbobni kanal ichida uzoq vaqt harakatsiz qoldirish."],"Silliq yo‘l, tez-tez irrigatsiya va ishlab chiqaruvchi tavsiyalari (tezlik, moment) sinish xavfini kamaytiradi."],
["Natriy gipoxlorit (NaOCl) endodontiyada qanday asosiy vazifani bajaradi?","Organik to‘qimalarni eritadi va antimikrob ta’sir ko‘rsatadi.",["Faqat kanalni mexanik kengaytiradi.","Dentin bilan mustahkam kimyoviy bog‘ hosil qiladi.","Guttaperchani qotiradi."],"NaOCl – asosiy irrigant: nekrotik va vital pulpa qoldiqlarini eritadi hamda keng spektrli antimikrob ta’sirga ega."],
["EDTA eritmasining endodontik ishlov berishdagi asosiy vazifasi nima?","Dentin tarkibidagi noorganik komponentlarni xelatlash va smear layerning noorganik qismini yo‘qotish.",["Organik pulpa qoldiqlarini eritish.","Kanalni quritish.","Kanalga antibakterial sement kiritish."],"EDTA kalsiy ionlarini bog‘laydi (xelatlaydi), shu bilan smear layerni olib tashlaydi."],
["NaOCl va EDTA eritmalarini qo‘llash ketma-ketligida qaysi fikr to‘g‘ri?","Ular orasida mos oraliq yuvish amalga oshirilishi kerak, chunki EDTA NaOClning erkin xlor miqdorini kamaytiradi.",["Ularni bir shpritsda aralashtirib yuborish kerak.","EDTA faqat kanal plombalangandan keyin qo‘llaniladi.","NaOCl faqat pulpa kamerasi uchun ishlatiladi."],"EDTA NaOCl bilan reaksiyaga kirishib erkin xlorni kamaytiradi, shuning uchun oralig‘ida yuvish (masalan, steril suv yoki NaOCl) zarur."],
["Xlorheksidinning NaOClga nisbatan asosiy cheklovlaridan biri qaysi?","Organik to‘qimalarni eritish xususiyatiga ega emas.",["Antimikrob ta’siri umuman yo‘q.","Dentin bilan aloqa qilganda umuman ta’sir ko‘rsatmaydi.","Faqat qattiq to‘qimalarni eritadi."],"Xlorheksidin antimikrob, lekin nekrotik to‘qimani erita olmaydi."],
["Natriy gipoxlorit va xlorheksidinni bevosita aralashtirish natijasida qanday modda hosil bo‘lishi mumkin?","Jigarrang-to‘q sariq cho‘kma.",["Kalsiy gidroksid.","Guttapercha.","EDTA kompleksi."],"Aralashganda jigarrang-to‘q sariq cho‘kma (parakloroanilin tutishi mumkin) hosil bo‘ladi; shuning uchun orasida oraliq yuvish shart."],

var L="ABCD",quiz=document.getElementById("quiz"),Q=[],done=false;
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function build(){
 done=false;var pos=[];for(var i=0;i<D.length;i++)pos.push(i%4);shuffle(pos);
 Q=D.map(function(d,i){var w=shuffle(d[2].slice()),o=[],k=0;for(var p=0;p<4;p++)o.push(p===pos[i]?d[1]:w[k++]);return{q:d[0],o:o,c:pos[i],e:d[3],a:-1}});
 var h="";S.forEach(function(s){h+='<h2 class="sec">'+s[0]+'</h2>';for(var n=s[1];n<=s[2];n++){var q=Q[n-1];h+='<div class="q" id="q'+(n-1)+'"><div class="t"><b>'+n+'.</b>'+q.q+'</div>';q.o.forEach(function(t,j){h+='<button class="o" data-q="'+(n-1)+'" data-o="'+j+'"><i>'+L[j]+'</i><span>'+t+'</span></button>'});h+='<div class="exp"></div></div>'}});
 quiz.innerHTML=h;quiz.classList.remove("locked");
 document.getElementById("res").style.display="none";document.getElementById("fin").style.display="block";upd();
}
function upd(){var n=Q.filter(function(q){return q.a>=0}).length;document.getElementById("cnt").textContent="Belgilangan: "+n+" / "+Q.length;var p=Math.round(n/Q.length*100);document.getElementById("pc").textContent=p+"%";document.getElementById("fill").style.width=p+"%"}
quiz.addEventListener("click",function(e){var b=e.target.closest(".o");if(!b||done)return;var qi=+b.dataset.q,oi=+b.dataset.o;Q[qi].a=oi;document.querySelectorAll('#q'+qi+' .o').forEach(function(x,j){x.classList.toggle("sel",j===oi)});upd()});
var dlg=document.getElementById("dlg");
document.getElementById("fin").onclick=function(){var left=Q.filter(function(q){return q.a<0}).length;if(left){document.getElementById("dmsg").textContent="Javob belgilanmagan savollar: "+left+" ta. Baribir yakunlaysizmi?";try{dlg.showModal()}catch(x){if(confirm("Javobsiz savollar: "+left+". Yakunlaysizmi?"))finish()}}else finish()};
document.getElementById("dno").onclick=function(){dlg.close()};
document.getElementById("dyes").onclick=function(){dlg.close();finish()};
function finish(){
 done=true;var ok=0,bad=0,skip=0;
 Q.forEach(function(q,i){var box=document.getElementById("q"+i),bs=box.querySelectorAll(".o");bs.forEach(function(b,j){b.classList.remove("sel");if(j===q.c)b.classList.add("ok");else if(j===q.a)b.classList.add("bad")});
  var st;if(q.a<0){skip++;st="⚠ Javob belgilanmagan."}else if(q.a===q.c){ok++;st="✅ To‘g‘ri."}else{bad++;st="❌ Noto‘g‘ri."}
  box.querySelector(".exp").innerHTML="<b>"+st+" To‘g‘ri javob: "+L[q.c]+")</b><br>"+q.e});
 quiz.classList.add("locked");
 var p=Math.round(ok/Q.length*100);
 document.getElementById("ring").style.setProperty("--p",p);document.getElementById("pct").textContent=p+"%";
 document.getElementById("sc").textContent="Siz to‘plagan ball: "+ok+" / "+Q.length;
 document.getElementById("s1").textContent="To‘g‘ri: "+ok;document.getElementById("s2").textContent="Noto‘g‘ri: "+bad;document.getElementById("s3").textContent="Belgilanmagan: "+skip;
 document.getElementById("msg").textContent=p>=86?"A’lo natija! 🦷":p>=71?"Yaxshi natija, takrorlashda davom eting.":p>=56?"Qoniqarli. Xato qilingan mavzularni takrorlang.":"Mavzularni qayta o‘qib chiqish tavsiya etiladi.";
 document.getElementById("res").style.display="block";document.getElementById("fin").style.display="none";
 window.scrollTo({top:0,behavior:"smooth"});
}
document.getElementById("again").onclick=function(){build();window.scrollTo({top:0,behavior:"smooth"})};
build();
</script>
